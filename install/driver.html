<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROTA Sürücü</title>
<style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#071225}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}#forgot{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;border:0;border-radius:999px;background:#f6be35;color:#071225;font-weight:900;padding:12px 15px;box-shadow:0 6px 20px #0004}#back{display:none;position:fixed;inset:0;z-index:60;background:#0009;align-items:center;justify-content:center;padding:18px}#box{width:min(420px,100%);background:#fff;border-radius:22px;padding:20px;box-sizing:border-box;color:#0f172a}h3{margin:0 0 6px}p{color:#64748b;font-size:13px;line-height:1.45}input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:1px solid #dbe3ee;border-radius:13px;font-size:16px}.act{width:100%;border:0;border-radius:13px;padding:14px;margin-top:9px;font-weight:900}#send,#save{background:#f6be35;color:#071225}#close{background:#eef2f7;color:#334155}#step2{display:none}#msg{min-height:18px;font-size:13px;margin-top:10px}</style></head>
<body><iframe src="https://rota-surucu-final15.onrender.com/" allow="geolocation"></iframe><button id="forgot">🔑 Şifremi Unuttum</button><button id="emailSetup" style="position:fixed;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;border:0;border-radius:999px;background:#fff;color:#071225;font-weight:900;padding:12px 15px;box-shadow:0 6px 20px #0004">📧 E-posta Tanımla</button>
<div id="back"><div id="box"><h3>Şifremi Unuttum</h3><p>Doğrulanmış e-posta adresinize gelen 6 haneli kodla yeni şifre belirleyin.</p><input id="phone" type="tel" placeholder="Telefon numarası"><button id="send" class="act">E-posta Kodu Gönder</button><div id="step2"><input id="newpass" type="password" minlength="6" placeholder="Yeni şifre (en az 6 karakter)"><button id="save" class="act">Yeni Şifreyi Kaydet</button></div><div id="msg"></div><button id="close" class="act">Kapat</button></div></div>
<script>const CORE="https://ftltemgtzkjfnkxsxxmd.supabase.co/functions/v1/rota2-core",KEY="sb_publishable_2d5xkUbWQECxv8jyaq2-Bg_sc-Qo8cr",$=i=>document.getElementById(i),dig=v=>String(v||"").replace(/\D/g,"").replace(/^90/,"").replace(/^0/,"").slice(-10);async function api(a,b){const r=await fetch(CORE+"?action="+a,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"İşlem başarısız");return j}forgot.onclick=()=>{back.style.display="flex";msg.textContent="";step2.style.display="none"};emailSetup.onclick=async()=>{const ph=prompt("Kayıtlı telefon numaranızı girin:");if(!ph)return;const pw=prompt("Mevcut şifrenizi girin:");if(!pw)return;const em=prompt("Hesabınıza bağlamak istediğiniz e-posta adresini girin:");if(!em)return;try{const s=await api("email-link-start",{role:"driver",phone:dig(ph),password:pw,email:em});const ok=confirm((s.emailMasked?s.emailMasked+" adresine":"E-posta adresinize")+' onay bağlantısı gönderildi. E-postadaki "Confirm email address" bağlantısına dokunun. Sonra buraya dönüp TAMAM deyin.');if(!ok)return;await api("email-link-confirm",{role:"driver",phone:dig(ph),password:pw,email:em});alert("E-posta adresiniz doğrulandı ve hesabınıza bağlandı.")}catch(e){alert(e.message||"E-posta tanımlanamadı.")}};close.onclick=()=>back.style.display="none";send.onclick=async()=>{const p=dig(phone.value);msg.style.color="#b91c1c";if(p.length!==10){msg.textContent="Geçerli telefon numarası girin.";return}send.disabled=true;try{const s=await api("password-reset-start",{role:"driver",phone:p});step2.style.display="block";msg.style.color="#047857";msg.textContent=(s.emailMasked||"E-posta adresinize")+" onay bağlantısı gönderildi. E-postadaki bağlantıya dokunun, sonra yeni şifrenizi yazıp kaydedin."}catch(e){msg.textContent=e.message}finally{send.disabled=false}};save.onclick=async()=>{const p=dig(phone.value),n=String(newpass.value||"");msg.style.color="#b91c1c";if(n.length<6){msg.textContent="Yeni şifre en az 6 karakter olmalı.";return}save.disabled=true;try{await api("password-reset-confirm",{role:"driver",phone:p,newPassword:n});msg.style.color="#047857";msg.textContent="Şifreniz değiştirildi. Yeni şifrenizle giriş yapabilirsiniz.";newpass.value=""}catch(e){msg.textContent=e.message}finally{save.disabled=false}};</script></body></html>
