name: ROTA Management APK
on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/rota-management-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rota-management-apk
  cancel-in-progress: false

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME missing from GitHub hosted runner"
            exit 1
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools missing"
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile ROTA Management APK
        working-directory: admin
        env:
          ROTA_VERSION_CODE: "2"
          ROTA_VERSION_NAME: "1.1.0"
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK file
        shell: bash
        run: |
          set -e
          test -s admin/app/build/outputs/apk/debug/app-debug.apk
          file admin/app/build/outputs/apk/debug/app-debug.apk
          unzip -t admin/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROTA-Yonetim-Onaylar-Test-APK
          path: admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish separate test APK (preserve current live APK)
        shell: bash
        run: |
          set -e
          mkdir -p apk
          cp admin/app/build/outputs/apk/debug/app-debug.apk apk/ROTA-Yonetim-Onaylar-Test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/ROTA-Yonetim-Onaylar-Test.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build ROTA Management approvals test APK"
            git push origin HEAD:main
          fi
