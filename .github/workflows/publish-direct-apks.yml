name: Publish Direct APK Downloads

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'customer/**'
      - 'driver/**'
      - '.github/workflows/publish-direct-apks.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build customer
        working-directory: customer
        run: gradle --no-daemon :app:assembleDebug
      - name: Build driver
        working-directory: driver
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish direct APK files
        run: |
          mkdir -p apk
          cp customer/app/build/outputs/apk/debug/app-debug.apk apk/ROTA-Musteri.apk
          cp driver/app/build/outputs/apk/debug/app-debug.apk apk/ROTA-Surucu.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/ROTA-Musteri.apk apk/ROTA-Surucu.apk
          if git diff --cached --quiet; then
            echo "APK files unchanged"
          else
            git commit -m "Guncel direkt APK dosyalarini yayinla"
            git push
          fi
