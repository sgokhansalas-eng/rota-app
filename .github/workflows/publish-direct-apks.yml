name: Publish Direct APK Downloads

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'customer/**'
      - 'driver/**'
      - '.github/workflows/publish-direct-apks.yml'

permissions:
  contents: write

concurrency:
  group: publish-direct-apks-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build customer
        working-directory: customer
        run: gradle --no-daemon :app:assembleDebug
      - name: Build driver
        working-directory: driver
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish direct APK files
        run: |
          cp customer/app/build/outputs/apk/debug/app-debug.apk /tmp/ROTA-Musteri.apk
          cp driver/app/build/outputs/apk/debug/app-debug.apk /tmp/ROTA-Surucu.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p apk
            cp /tmp/ROTA-Musteri.apk apk/ROTA-Musteri.apk
            cp /tmp/ROTA-Surucu.apk apk/ROTA-Surucu.apk
            git add -f apk/ROTA-Musteri.apk apk/ROTA-Surucu.apk

            if git diff --cached --quiet; then
              echo "APK files unchanged"
              exit 0
            fi

            git commit -m "Guncel direkt APK dosyalarini yayinla"

            if git push origin HEAD:main; then
              echo "APK files published"
              exit 0
            fi

            echo "Remote changed during publish; retrying ($attempt/3)"
            sleep 2
          done

          echo "APK publish failed after 3 attempts"
          exit 1
