name: Publish ROTA iPhone Install Page

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'install/**'
      - '.github/workflows/publish-install-page.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload install page
        uses: actions/upload-pages-artifact@v3
        with:
          path: install

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
