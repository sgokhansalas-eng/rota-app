name: Build ROTA APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'customer/**'
      - 'driver/**'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, driver, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ${{ matrix.app }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          if [ "${{ matrix.app }}" = "customer" ]; then
            cp customer/app/build/outputs/apk/debug/app-debug.apk out/ROTA-Musteri.apk
          elif [ "${{ matrix.app }}" = "driver" ]; then
            cp driver/app/build/outputs/apk/debug/app-debug.apk out/ROTA-Surucu.apk
          else
            cp admin/app/build/outputs/apk/debug/app-debug.apk out/ROTA-Yonetim.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-${{ matrix.app }}-apk
          path: out/*.apk
          if-no-files-found: error
