name: ROTA
options:
  deploymentTarget:
    iOS: "15.0"

targets:
  ROTAMusteri:
    type: application
    platform: iOS
    sources:
      - Customer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rota.ios.customer
        PRODUCT_NAME: ROTA-Musteri
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ROTA Müşteri"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ROTA, alış konumunuzu belirlemek için konum izninizi kullanır."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"

  ROTASurucu:
    type: application
    platform: iOS
    sources:
      - Driver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rota.ios.driver
        PRODUCT_NAME: ROTA-Surucu
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ROTA Sürücü"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ROTA Sürücü, müşteriye yönlendirme ve sürüş işlemleri için konum izninizi kullanır."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "ROTA Sürücü, çevrimiçi olduğunuzda müşterilerin sizi canlı haritada görebilmesi ve sürüş sırasında konumunuzu güncelleyebilmesi için arka planda konum izninizi kullanır."
        INFOPLIST_KEY_UIBackgroundModes:
          - location
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
